name: Daily Coffee Price Intelligence Pipeline

on:
  schedule:
    # Her sabah TSİ 09:00 (UTC 06:00)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  track-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle (Önbelleksiz Temiz Kurulum)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Veri Klasörünü Hazırla
        run: |
          mkdir -p Data

      - name: Boru Hattını Çalıştır (Scrape + ML + Notifier)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Güncellenen SQLite Veritabanını Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/coffee_tracker.db
          git diff --staged --quiet || git commit -m "chore(data): auto-update price history [skip ci]"
          git push