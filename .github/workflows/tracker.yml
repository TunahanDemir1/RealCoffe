name: Daily Coffee Price Intelligence Pipeline

on:
  schedule:
    # Her sabah Türkiye saatiyle 09:00'da çalışır (UTC 06:00)
    - cron: '0 6 * * *'
  # GitHub arayüzünden manuel olarak tetikleme butonu ekler
  workflow_dispatch:

jobs:
  track-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install python-dotenv

      - name: Boru Hattını Çalıştır (Scrape + ML + Notifier)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Güncellenen SQLite Veritabanını Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/coffee_tracker.db
          git diff --staged --quiet || git commit -m "chore(data): auto-update price history [skip ci]"
          git push